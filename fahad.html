<!DOCTYPE html>
<html>
<head>
    <title>Chudo kaifre</title>
    <style>
        #container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            gap: 20px;
        }
        #victim {
            width: 200px;
            height: 300px;
            border: 3px solid red;
            object-fit: cover;
            border-radius: 8px;
            transition: transform 0.3s ease, filter 0.3s ease;
        }
        #aggressor {
            width: 200px;
            height: 200px;
            border: 3px solid blue;
            object-fit: cover;
            border-radius: 8px;
            transition: transform 0.5s ease, opacity 0.5s ease;
        }
        button {
            font-size: 20px;
            padding: 15px;
            margin: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="container">
        <img id="victim" src="Fahad.jpeg" alt="Fahad">
        <img id="aggressor" src="WhatsApp%20Image%202026-06-05%20at%206.00.47%20AM.jpeg" alt="Aggressor">
        <div>
            <button onclick="Him()">HIM</button>
            <button onclick="leaveHim()">LEAVE HIM</button>
        </div>
    </div>
    <script>
        function Him() {
            const victim = document.getElementById('victim');
            victim.style.transform = 'scale(1.1)';
            victim.style.filter = 'brightness(1.5)';
            setTimeout(() => {
                victim.style.transform = '';
                victim.style.filter = '';
            }, 500);
        }

        function leaveHim() {
            const aggressor = document.getElementById('aggressor');
            aggressor.style.transform = 'translateX(300px) rotate(30deg)';
            aggressor.style.opacity = '0';
            setTimeout(() => {
                aggressor.style.transform = '';
                aggressor.style.opacity = '1';
            }, 1000);
        }
    </script>
</body>
</html>
